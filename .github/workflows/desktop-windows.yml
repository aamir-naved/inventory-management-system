name: Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - "scripts/package-desktop-windows.ps1"
      - "scripts/generate-desktop-icons.py"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches: [main, windows-desktop-app]
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - "scripts/package-desktop-windows.ps1"
      - "scripts/generate-desktop-icons.py"
      - ".github/workflows/desktop-windows.yml"

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install Maven
        run: choco install maven --no-progress -y

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Package Windows installer
        shell: pwsh
        run: ./scripts/package-desktop-windows.ps1

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: InventoryManagement-Setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
