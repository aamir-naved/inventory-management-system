name: E2E

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/e2e.sh"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/e2e.sh"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  shop-loop:
    name: Counter shop loop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start Compose stack
        run: |
          cp .env.example .env
          # Keep registration open so the shop-loop can sign up a fresh owner.
          printf '\nAPP_OPEN_REGISTRATION=true\nSPRING_PROFILES_ACTIVE=dev\n' >> .env
          docker compose up --build -d
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/actuator/health >/dev/null; then
              echo "Stack is healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Install frontend deps and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright shop loop
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Stop Compose
        if: always()
        run: docker compose down -v
