spring:
  application:
    name: inventory-management-system
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_management}
    username: ${DB_USERNAME:inventory_user}
    password: ${DB_PASSWORD:inventory_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  tenant:
    header-name: X-Business-Id
  auth:
    jwt-secret: ${APP_JWT_SECRET:}
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:PT1H}
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:P14D}
    email-verify-token-ttl: ${APP_EMAIL_VERIFY_TOKEN_TTL:PT24H}
    password-reset-token-ttl: ${APP_PASSWORD_RESET_TOKEN_TTL:PT1H}
    public-app-url: ${APP_PUBLIC_APP_URL:http://localhost:5173}
    mail-from: ${APP_MAIL_FROM:noreply@inventory.local}
    sms-webhook-url: ${APP_SMS_WEBHOOK_URL:}
  platform:
    open-registration: ${APP_OPEN_REGISTRATION:true}
    admin-email: ${APP_PLATFORM_ADMIN_EMAIL:}
    admin-password: ${APP_PLATFORM_ADMIN_PASSWORD:}
    admin-reset: ${APP_PLATFORM_ADMIN_RESET:false}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:3000
      - http://127.0.0.1:3000
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
  desktop:
    enabled: false
    data-dir: ${APP_DATA_DIR:}
    pg-bin: ${APP_DESKTOP_PG_BIN:}
    db-host: ${DB_HOST:127.0.0.1}
    db-port: ${DB_PORT:5432}
