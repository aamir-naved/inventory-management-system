spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  auth:
    jwt-secret: ${APP_JWT_SECRET:}
    public-app-url: ${APP_PUBLIC_APP_URL:}
  platform:
    open-registration: ${APP_OPEN_REGISTRATION:false}
    admin-email: ${APP_PLATFORM_ADMIN_EMAIL:}
    admin-password: ${APP_PLATFORM_ADMIN_PASSWORD:}
    admin-reset: ${APP_PLATFORM_ADMIN_RESET:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: []

logging:
  level:
    root: INFO
