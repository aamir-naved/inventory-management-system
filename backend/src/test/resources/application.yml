spring:
  datasource:
    url: jdbc:h2:mem:inventory-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  auth:
    jwt-secret: inventory-management-system-test-secret-key-for-jwt-signing-2026
    access-token-ttl: PT1H
    refresh-token-ttl: P14D
    public-app-url: http://localhost:5173
