[package]
name = "inventory-desktop"
version = "0.1.0"
description = "Windows desktop shell for the inventory management system"
authors = ["Inventory Management"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "inventory_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "inventory-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
