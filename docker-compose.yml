services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_management}
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ims-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventory_management}
      DB_USERNAME: ${POSTGRES_USER:-inventory_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inventory_password}
      # JWT, SMTP, and CORS come from env_file (.env). Do not default JWT here —
      # the Spring `dev` profile supplies a development secret; `prod` refuses to start without a real one.
      APP_PUBLIC_APP_URL: ${APP_PUBLIC_APP_URL:-http://localhost:3000}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@inventory.local}
      APP_OPEN_REGISTRATION: ${APP_OPEN_REGISTRATION:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: ims-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
